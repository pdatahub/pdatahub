name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Pure docs-only changes don't need the Go toolchain (~30s install).
    # This filter narrows the runner job to runner-touching PRs only.
    outputs:
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Trigger the go-runner job when any of these change.
          # Also fires on push to main so the job runs nightly / per-push.
          filters: |
            runner:
              - 'packages/runner/**'
              - '.github/workflows/ci.yml'

  typescript:
    name: TypeScript (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  go-runner:
    name: Go runner (vet + test + build)
    needs: changes
    if: needs.changes.outputs.runner == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: packages/runner/go.sum

      - name: Download modules
        working-directory: packages/runner
        run: go mod download

      - name: Vet
        working-directory: packages/runner
        run: go vet ./...

      - name: Test (race + coverage)
        working-directory: packages/runner
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        working-directory: packages/runner
        run: go build ./...

      - name: Dry-run smoke
        working-directory: packages/runner
        run: go run ./cmd/runner --dry-run

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runner-coverage
          path: packages/runner/coverage.out
          retention-days: 7

  android:
    name: Android (assemble + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/android-app/gradle/wrapper/gradle-wrapper.properties', 'packages/android-app/build.gradle.kts', 'packages/android-app/app/build.gradle.kts', 'packages/android-app/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: packages/android-app
        run: ./gradlew assembleDebug

      - name: Run unit tests
        working-directory: packages/android-app
        run: ./gradlew test

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: packages/android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
